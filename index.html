<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3">
  <title>행복 우체통 | 행복기숙사</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-mailbox" aria-hidden="true">
        <div class="mailbox-body"><span>♥</span></div>
        <div class="mailbox-flag"></div>
      </div>
      <p class="eyebrow">행복기숙사 주간 이벤트</p>
      <h1>행복 우체통</h1>
      <p class="hero-copy">이번 주, 누군가에게 전하고 싶은<br><strong>따뜻한 한마디</strong>를 남겨주세요.</p>
    </section>

    <section class="card">
      <div class="card-heading">
        <div class="heading-icon">💌</div>
        <div>
          <h2>마음을 담아 보내기</h2>
          <p>작성한 편지는 관리자만 확인할 수 있어요.</p>
        </div>
      </div>

      <form id="mailForm" novalidate>
        <div class="field">
          <label for="instagram">인스타그램 아이디 <span>* 경품 안내용</span></label>
          <div class="input-wrap"><b>@</b><input id="instagram" name="instagram" type="text" maxlength="40" placeholder="instagram_id" autocomplete="off" required></div>
          <p class="help">이벤트 당첨 시 DM으로 안내드리기 위해 사용돼요.</p>
        </div>

        <div class="field">
          <label for="message">행복 편지 <em>*</em></label>
          <textarea id="message" name="message" maxlength="300" placeholder="기숙사에서 전하고 싶은 이야기를 적어주세요."></textarea>
          <div class="counter"><span id="count">0</span> / 300</div>
        </div>

        <label class="agree">
          <input id="privacyAgree" type="checkbox" required>
          <span>이벤트 운영 및 경품 안내를 위해 인스타그램 아이디와 편지를 수집하는 데 동의합니다.</span>
        </label>

        <button class="submit-btn" type="submit"><span>📮</span> 우체통에 넣기</button>
      </form>
    </section>

    <section class="friday-card">
      <div class="friday-icon">📬</div>
      <div>
        <h3>금요일에는 행복편지를 소개해요</h3>
        <p>한 주 동안 도착한 편지 중 따뜻한 이야기를 선정해 소개할 예정이에요.</p>
      </div>
    </section>

    <p class="footer">행복기숙사 · 한국사학진흥재단</p>
  </main>

  <div class="modal" id="successModal" aria-hidden="true">
    <div class="modal-dim"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <div class="success-icon">💌</div>
      <p class="success-label">행복 우체통</p>
      <h2 id="successTitle">편지가 도착했어요!</h2>
      <p>따뜻한 마음을 보내주셔서 감사합니다.<br>금요일에 행복편지를 만나보세요.</p>
      <button id="closeModal" class="modal-btn">확인</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
