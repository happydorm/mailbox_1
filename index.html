<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행복 우체통 | 행복기숙사</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="mailbox-icon">📮</div>
      <p class="eyebrow">행복기숙사 주간 이벤트</p>
      <h1>행복 우체통</h1>
      <p class="hero-copy">이번 주, 누군가에게 전하고 싶은<br><strong>따뜻한 한마디</strong>를 남겨주세요.</p>
    </header>

    <section class="card">
      <div class="card-title">
        <span>💌</span>
        <div>
          <h2>마음을 담아 보내기</h2>
          <p>작성한 편지는 관리자만 확인할 수 있어요.</p>
        </div>
      </div>

      <form id="mailForm">
        <label for="instagram">인스타그램 아이디 <span class="required">* 경품 안내용</span></label>
        <input id="instagram" name="instagram" type="text" maxlength="40" placeholder="예) @kasfo_official" required>
        <p class="help">이벤트 당첨 시 DM으로 안내드리기 위해 사용돼요.</p>

        <label for="message">행복 편지 <span class="required">*</span></label>
        <textarea id="message" name="message" maxlength="300" placeholder="기숙사에서 전하고 싶은 이야기를 적어주세요." required></textarea>
        <div class="counter"><span id="count">0</span> / 300</div>

        <label class="agree"><input id="privacyAgree" type="checkbox" required> <span>이벤트 운영 및 경품 안내를 위해 인스타그램 아이디와 편지를 수집하는 데 동의합니다.</span></label>

        <button type="submit">📮 우체통에 넣기</button>
      </form>
    </section>

    <section class="notice">
      <h3>📬 이번 주 행복편지는?</h3>
      <p>한 주 동안 도착한 편지 중 따뜻한 이야기를 선정해 금요일에 소개할 예정이에요.</p>
    </section>

    <footer>행복기숙사 · 한국사학진흥재단</footer>
  </main>

  <div class="modal" id="successModal" aria-hidden="true">
    <div class="modal-box">
      <div class="big-icon">💌</div>
      <h2>편지가 도착했어요!</h2>
      <p>따뜻한 마음을 행복 우체통에 보내주셔서 감사합니다.</p>
      <button id="closeModal">확인</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
